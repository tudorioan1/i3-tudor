[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format-prefix = " "
format-prefix-foreground = ${colors.fg-alt}
label-layout = %layout%
label-layout-foreground = ${colors.fg}
click-left = ~/.config/i3/polybar-i3/scripts/kb-toggle.sh
click-right = ~/.config/i3/polybar-i3/scripts/kb-toggle.sh
